name: blog

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: kyou-blog:${TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://blog:${BLOG_DB_PASSWORD}@promptvault-ecs-db-1:5432/blog
      DATABASE_SSL: "false"
      DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - ../data:/app/data
    networks:
      - web
      - db

  tunnel:
    image: ${TUNNEL_IMAGE:-cloudflare/cloudflared:2026.10.4}
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - web

networks:
  web:
    name: blog-web
  db:
    # reuse the existing promptvault PostgreSQL instance (ADR-0002)
    name: promptvault-ecs_default
    external: true
